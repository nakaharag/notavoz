# Requires Compose >= 2.24.4 for !override. No public ACME or provider calls.
services:
  caddy:
    ports: !override
      - '127.0.0.1:8080:80'
      - '127.0.0.1:8443:443'
    environment:
      NOTAVOZ_DOMAIN: localhost
  backend:
    command: ['node', '--require', '/smoke/openai-mock.cjs', 'dist/main.js']
    volumes:
      - ./deploy/openai-mock.cjs:/smoke/openai-mock.cjs:ro
